# Exception messages
problem.auth.invalid-token=Authentication token is invalid or missing required data.

problem.validation.title=Validation failed
problem.validation.detail=One or more fields/properties contain invalid values.

problem.not-found.title=Resource not found
problem.not-found.detail=The requested resource does not exist.
problem.not-found.device=Device with id {0} was not found.
problem.not-found.program=Program with id {0} was not found.
problem.not-found.users=One or more users in the access list do not exist.

problem.conflict.title=Conflict
problem.conflict.detail=The request could not be completed due to a conflict with the current state of the resource.
device.conflict.owner-name=You already have a device named "{0}".
device.conflict.owner-mac-address=You already have a device with MAC address "{0}".
program.conflict.device-filename=Device "{1}" already has a program with filename "{0}".
program.conflict.device-name=Device "{1}" already has a program named "{0}".
program.conflict.start-not-stopped=The program "{0}" cannot be started because it is not currently stopped.
program.conflict.stop-not-started=The program "{0}" cannot be stopped because it is not currently running.
user.conflict.email=The email "{0}" is already registered.
user.conflict.username=The username "{0}" is already taken.

problem.forbidden.title=Forbidden
problem.forbidden.detail=You do not have permission to perform this action.
problem.forbidden.device-access=You do not have access to the device with id {0}.
problem.forbidden.program-access=You do not have access to the program with id {0}.

# Connection errors (for SseService/WoL)
problem.connection.title=Connection Error
problem.connection.detail=Could not communicate with the device. It might be offline or unreachable.

# Internal server error
problem.internal.title=System Error
problem.internal.detail=An internal error occurred in the system. Please try again later or contact support.

# Validation messages
name.required=Name cannot be empty.
name.max-length=Name can be at most {max} characters.
filename.required=Filename cannot be empty.
filename.max-length=Filename can be at most {max} characters.

device.public-ip.required=Public IP cannot be empty.
device.public-ip.invalid=Public IP must be a valid IPv4 or IPv6 address.
device.wol-port.required=Wake-on-LAN port is required.
device.wol-port.min=Wake-on-LAN port must be at least {value}.
device.wol-port.max=Wake-on-LAN port must be at most {value}.
device.mac-address.required=MAC address cannot be empty.
device.mac-address.invalid=MAC address must use the format 00:11:22:33:44:55.

program.is-public.required=IsPublic field is required.
