# Production profile for remote-program-control-ws-rest
# Configure via environment variables when deploying (no secrets in VCS).

# --- DataSource (Aiven PostgreSQL example) ---
# Fall back to a local sane URL instead of HOST:PORT placeholders so it doesn't crash if env isn't loaded.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remote_program_control?sslmode=disable}
spring.datasource.username=${DB_USER:remote_program_control}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
# Optional: set a dedicated schema for this app
spring.datasource.hikari.schema=${DB_SCHEMA:remote_program_control}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# H2
spring.h2.console.enabled=false