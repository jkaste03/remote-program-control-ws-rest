# Production profile for remote-program-control-ws-rest
# Configure via environment variables when deploying (no secrets in VCS).

# --- HTTP ---
# Netlify proxies /remote-program-control/* to this service.
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/remote-program-control}
server.forward-headers-strategy=framework
server.tomcat.redirect-context-root=false
server.tomcat.use-relative-redirects=true

# --- DataSource (PostgreSQL on the Oracle VPS) ---
# Keep the connection details outside the application artifact.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remote_program_control?sslmode=disable}
spring.datasource.username=${DB_USER:remote_program_control}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
# Use a dedicated schema when it has been created on the VPS.
spring.datasource.hikari.schema=${DB_SCHEMA:public}

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${APP_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# JWT
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.issuer=${APP_JWT_ISSUER:remote-program-control}
app.security.jwt.access-ttl-seconds=${APP_JWT_ACCESS_TTL_SECONDS:900}
app.security.jwt.refresh-ttl-seconds=${APP_JWT_REFRESH_TTL_SECONDS:604800}

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# H2
spring.h2.console.enabled=false

# TomEE: disable JTA auto-detection, use local transactions
spring.jta.enabled=false
