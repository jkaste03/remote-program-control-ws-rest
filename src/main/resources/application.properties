server.port=8090

spring.application.name=Remote program control ws rest

#;DB_CLOSE_DELAY=-1
#spring.datasource.url=jdbc:h2:file:~/h2/librarydb
spring.datasource.url=jdbc:h2:mem:librarydb;NON_KEYWORDS=user,order
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update

spring.h2.console.enabled=true
# default path: h2-console
#spring.h2.console.path=/h2-ui

user.resource.roles=ADMIN,USER

app.security.jwt.secret=${APP_JWT_SECRET:change-me-dev-secret-change-me-dev-secret}
app.security.jwt.issuer=remote-program-control
app.security.jwt.access-ttl-seconds=900
app.security.jwt.refresh-ttl-seconds=604800

# TomEE: disable JTA auto-detection, use local transactions
spring.jta.enabled=false
