<!DOCTYPE html>
<html lang="en" th:attr="lang=${#locale}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="device.edit.pageTitle">Edit Device - Remote Program Control</title>
        <meta name="access-token" th:content="${accessToken}" content="" />
        <meta name="device-id" th:content="${deviceId}" content="" />
        <meta name="context-path" th:content="@{/}" content="/" />
        <meta name="locale" th:content="${#locale}" content="en" />
        <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    </head>
    <body>
        <div class="page">
            <header class="top-bar">
                <div>
                    <p class="eyebrow" data-i18n="app.title">Remote Program Control</p>
                    <h1 data-i18n="device.edit.heading">Edit Device</h1>
                </div>
                <div class="user-box">
                    <span class="user-name" th:text="${#authentication.name}">User</span>
                    <form class="logout-form" method="post" th:action="@{/logout}" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="logout" type="submit" data-i18n="common.logout">Logout</button>
                    </form>
                </div>
            </header>

            <div id="toast" class="toast toast-hidden" role="status"></div>

            <div class="form-container">
                <form id="edit-device-form">
                    <input type="hidden" id="publicIp" name="publicIp" />

                    <div class="form-group">
                        <label for="name" data-i18n="device.form.name.label">Device Name</label>
                        <input type="text" id="name" name="name" required maxlength="100" />
                    </div>

                    <div class="form-group">
                        <label for="wakeOnLanPort" data-i18n="device.form.wolPort.label">Wake On LAN Port</label>
                        <input type="number" id="wakeOnLanPort" name="wakeOnLanPort" required min="1" max="65535" />
                    </div>

                    <div class="form-group">
                        <label for="macAddress" data-i18n="device.form.mac.label">MAC Address</label>
                        <input
                            type="text"
                            id="macAddress"
                            name="macAddress"
                            required
                            pattern="^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$"
                            title="MAC must use the format 00:11:22:33:44:55"
                            data-i18n="device.form.mac.title"
                            data-i18n-attr="title"
                        />
                        <small data-i18n="device.form.mac.help">Format: 00:11:22:33:44:55</small>
                    </div>

                    <div class="button-group">
                        <a th:href="@{/}" href="/" class="btn btn-secondary" data-i18n="common.cancel">Cancel</a>
                        <button type="submit" class="btn btn-primary" data-i18n="common.saveChanges">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            /*<![CDATA[*/
            window.__ACCESS_TOKEN__ = /*[[${accessToken}]]*/ null;
            /*]]>*/
        </script>
        <script type="module" th:src="@{/js/edit-device.js}" src="/js/edit-device.js"></script>
    </body>
</html>
