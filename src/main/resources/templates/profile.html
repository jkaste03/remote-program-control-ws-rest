<!doctype html>
<html lang="en" th:attr="lang=${#locale}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile - Remote Program Control</title>
        <meta name="access-token" th:content="${accessToken}" content="" />
        <meta name="context-path" th:content="@{/}" content="/" />
        <meta name="locale" th:content="${#locale}" content="en" />
        <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    </head>
    <body>
        <div class="page">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">Remote Program Control</p>
                    <h1>Profile</h1>
                </div>
                <div class="user-box">
                    <span class="user-name" th:text="${#authentication.name}">User</span>
                    <form class="logout-form" method="post" th:action="@{/logout}" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="logout" type="submit">Logout</button>
                    </form>
                </div>
            </header>

            <div id="toast" class="toast toast-hidden" role="status"></div>

            <div class="form-container">
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-username"
                            >Username (use your Minecraft username if you plan to play on a Minecraft server)</label
                        >
                        <input
                            id="profile-username"
                            name="username"
                            required
                            minlength="3"
                            maxlength="255"
                            th:value="${#authentication.name}"
                        />
                    </div>
                    <div class="button-group">
                        <a th:href="@{/}" href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save username</button>
                    </div>
                </form>
            </div>
        </div>

        <script type="module" th:src="@{/js/profile.js}" src="/js/profile.js"></script>
    </body>
</html>
