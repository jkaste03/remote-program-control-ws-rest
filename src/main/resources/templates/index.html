<!DOCTYPE html>
<html lang="en" th:attr="lang=${#locale}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="dashboard.pageTitle">Remote Program Control</title>
        <meta name="access-token" th:content="${accessToken}" content="" />
        <meta name="locale" th:content="${#locale}" content="en" />
        <meta name="context-path" th:content="@{/}" content="/" />
        <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    </head>
    <body>
        <div class="page">
            <header class="top-bar">
                <div>
                    <p class="eyebrow" data-i18n="app.title">Remote Program Control</p>
                    <h1 data-i18n="dashboard.heading">My devices</h1>
                </div>
                <div class="user-box">
                    <span class="user-name" th:text="${#authentication.name}">User</span>
                    <a class="btn btn-secondary" th:href="@{/profile}" href="/profile">Profile</a>
                    <form class="logout-form" method="post" th:action="@{/logout}" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="logout" type="submit" data-i18n="common.logout">Logout</button>
                    </form>
                </div>
            </header>

            <div id="toast" class="toast toast-hidden" role="status"></div>
            <div id="device-container" class="device-container" aria-live="polite"></div>
        </div>

        <script>
            /*<![CDATA[*/
            window.__ACCESS_TOKEN__ = /*[[${accessToken}]]*/ null;
            /*]]>*/
        </script>
        <script type="module" th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>
    </body>
</html>
