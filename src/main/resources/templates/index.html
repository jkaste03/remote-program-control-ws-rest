<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Remote Program Control</title>
        <meta name="access-token" th:content="${accessToken}" content="" />
        <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css" />
    </head>
    <body>
        <div class="page">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">Remote Program Control</p>
                    <h1>My devices</h1>
                </div>
                <div class="user-box">
                    <span class="user-name" th:text="${#authentication.name}">User</span>
                    <a class="logout" href="/logout">Logout</a>
                </div>
            </header>

            <div id="toast" class="toast toast-hidden" role="status"></div>
            <div id="device-container" class="device-container" aria-live="polite"></div>
        </div>

        <script>
            /*<![CDATA[*/
            window.__ACCESS_TOKEN__ = /*[[${accessToken}]]*/ null;
            /*]]>*/
        </script>
        <script type="module" th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>
    </body>
</html>
