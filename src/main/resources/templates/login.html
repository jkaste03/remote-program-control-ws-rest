<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="context-path" th:content="@{/}" content="/" />
    <title>Login - Remote Program Control</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>
<body>
    <div class="page auth-page">
        <header class="top-bar">
            <div>
                <p class="eyebrow">Remote Program Control</p>
                <h1>Login</h1>
            </div>
        </header>

        <div class="form-container">
            <form method="post" th:action="@{/login}" action="/login">
                <div class="form-group">
                    <label for="username">Username or email</label>
                    <input type="text" id="username" name="username" required autofocus />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${param.error}" class="alert alert-error"
                     th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message ?: 'Login failed'}">
                    Login failed
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    Logged out.
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
                <p class="meta">
                    Don't have an account?
                    <a th:href="@{/register}" href="/register">Create one</a>
                </p>
            </form>
        </div>
        <div th:if="${param.registered}" class="alert alert-info">
            Registration successful. Please log in.
        </div>
    </div>
</body>
</html>
