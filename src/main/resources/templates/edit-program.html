<!doctype html>
<html lang="en" th:attr="lang=${#locale}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="program.edit.pageTitle">Edit Program - Remote Program Control</title>
        <meta name="access-token" th:content="${accessToken}" content="" />
        <meta name="program-id" th:content="${programId}" content="" />
        <meta name="context-path" th:content="@{/}" content="/" />
        <meta name="locale" th:content="${#locale}" content="en" />
        <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    </head>
    <body>
        <div class="page">
            <header class="top-bar">
                <div>
                    <p class="eyebrow" data-i18n="app.title">Remote Program Control</p>
                    <h1 data-i18n="program.edit.heading">Edit Program</h1>
                </div>
                <div class="user-box">
                    <span class="user-name" th:text="${#authentication.name}">User</span>
                    <form class="logout-form" method="post" th:action="@{/logout}" action="/logout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="logout" type="submit" data-i18n="common.logout">Logout</button>
                    </form>
                </div>
            </header>

            <div id="toast" class="toast toast-hidden" role="status"></div>

            <div class="form-container">
                <form id="edit-program-form">
                    <div class="form-group">
                        <label for="filename" data-i18n="program.form.filename.label">Filename</label>
                        <input type="text" id="filename" name="filename" readonly />
                        <small data-i18n="program.form.filename.help">Filename cannot be changed here.</small>
                    </div>

                    <div class="form-group">
                        <label for="name" data-i18n="program.form.name.label">Program name</label>
                        <input type="text" id="name" name="name" required maxlength="255" />
                    </div>

                    <div class="form-group">
                        <div class="toggle-line">
                            <input type="checkbox" id="isPublic" name="isPublic" />
                            <label for="isPublic" data-i18n="program.form.public.label"
                                >Public program</label
                            >
                        </div>
                    </div>

                    <div class="form-group hidden" id="allowed-users-section">
                        <label for="userSearch" data-i18n="program.form.allowedUsers.label">Allowed users</label>
                        <small data-i18n="program.form.allowedUsers.help"
                            >Select which users can access this program.</small
                        >
                        <div class="chip-container" id="selected-users"></div>

                        <div class="user-search">
                            <input
                                type="text"
                                id="userSearch"
                                name="userSearch"
                                placeholder="Search by username or email"
                                data-i18n="program.search.placeholder"
                                data-i18n-attr="placeholder"
                                autocomplete="off"
                            />
                            <button type="button" id="userSearchBtn" data-i18n="program.form.search">Search</button>
                        </div>
                        <div class="search-results hidden" id="user-search-results"></div>
                    </div>

                    <div class="button-group">
                        <a th:href="@{/}" href="/" class="btn btn-secondary" data-i18n="common.cancel">Cancel</a>
                        <button type="submit" class="btn btn-primary" data-i18n="common.saveChanges">
                            Save changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            /*<![CDATA[*/
            window.__ACCESS_TOKEN__ = /*[[${accessToken}]]*/ null;
            /*]]>*/
        </script>
        <script type="module" th:src="@{/js/edit-program.js}" src="/js/edit-program.js"></script>
    </body>
</html>
